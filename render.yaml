services:
  - type: web
    name: market-analysis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 8 --timeout 600 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ADMIN_PASSWORD
        sync: false
      - key: TICKERALL_API_KEY
        sync: false
      - key: MT5_SERVER
        sync: false
      - key: MT5_ACCOUNT_ID
        sync: false
      - key: MT5_PASSWORD
        sync: false
      - key: SIGNALBOT_MODE
        value: demo
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION
        sync: false
      - key: TG_CHANNELS
        value: "Master blue=-1003696057640,Liquidity Trader=-1003754368542"
